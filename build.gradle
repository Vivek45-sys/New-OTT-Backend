plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2' // Add Spring Boot plugin
    id 'io.spring.dependency-management' version '1.1.3' // Manages versions
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.2.2'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.11.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test {
    useJUnitPlatform()
}
